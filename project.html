<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="/">Portfolio</a>
    <nav id="site-nav" class="site-nav"></nav>
  </div>
</header>

<main class="wrap detail">
  <a href="/#projects" class="back-link">&larr; All projects</a>
  <div id="project-detail"><p class="empty">Loading…</p></div>
</main>

<footer id="contact" class="site-footer">
  <div class="wrap">
    <p id="footer-contact"></p>
  </div>
</footer>

<script src="/assets/site.js"></script>
<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  let site = {};
  try{
    site = await fetchJSON('/content/site.json');
    document.getElementById('footer-contact').innerHTML = footerContactHTML(site);
    await initNav(site);
  }catch(e){ console.error(e); }

  const el = document.getElementById('project-detail');
  try{
    const data = await fetchJSON('/content/projects.json');
    const item = (data.items || []).find(p => p.slug === slug);
    if(!item){
      el.innerHTML = '<p class="empty">Project not found.</p>';
      return;
    }
    document.title = item.title + (site.name ? ' — ' + site.name : '');
    const gallery = (item.gallery || []).map(g => (g && g.image) ? g.image : g).filter(Boolean);
    el.innerHTML = `
      ${coverHTML(item, 'large')}
      <h1>${escapeHTML(item.title)}</h1>
      <div class="detail-meta">
        ${item.date ? `<span>${formatDate(item.date)}</span>` : ''}
        ${item.link ? `<a href="${escapeHTML(item.link)}" target="_blank" rel="noopener" class="btn btn-ghost">View live &rarr;</a>` : ''}
      </div>
      ${renderTags(item.tags)}
      <div class="prose">${renderMarkdown(item.body || '')}</div>
      ${gallery.length ? `<div class="gallery">${gallery.map(src => `<img src="${escapeHTML(src)}" loading="lazy" alt="${escapeHTML(item.title)}">`).join('')}</div>` : ''}
    `;
  }catch(e){
    el.innerHTML = '<p class="empty">Could not load this project.</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
